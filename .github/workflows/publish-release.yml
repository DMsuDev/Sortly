name: "Publish Release"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach assets to (required for manual runs)"
        required: true
        default: "v0.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

env:
  BUILD_DIR: build
  PROJECT_NAME: Sortly
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: The tag must be strict SemVer and match the VERSION file
  # ---------------------------------------------------------------------------
  validate-tag:
    name: Validate tag and VERSION
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${RELEASE_TAG}' is not a valid semantic version (vX.Y.Z)"
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${VERSION}" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::VERSION file is '${VERSION}' but the tag is '${RELEASE_TAG}'. Bump VERSION before tagging."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 1: Build and package the binaries for each target platform
  # ---------------------------------------------------------------------------
  build:
    name: Build & Package (${{ matrix.os }})
    needs: validate-tag
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            bin_dir: bin
            exe: sortly

          - os: windows-latest
            platform: windows-x64
            bin_dir: bin/Release # Visual Studio adds the configuration folder
            exe: sortly.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S . \
            -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSORTLY_ENABLE_UNIT_TESTS=OFF \
            -DSORTLY_ENABLE_LTO=ON \
            ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        shell: bash
        run: cmake --build "${BUILD_DIR}" --config Release --parallel

      # The app looks for assets/fonts next to the executable, so they ship together.
      - name: Stage package
        shell: bash
        run: |
          PACKAGE_NAME="${PROJECT_NAME}-${RELEASE_TAG}-${{ matrix.platform }}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

          mkdir -p "${PACKAGE_NAME}"
          cp "${BUILD_DIR}/${{ matrix.bin_dir }}/${{ matrix.exe }}" "${PACKAGE_NAME}/"
          cp -r "${BUILD_DIR}/${{ matrix.bin_dir }}/assets" "${PACKAGE_NAME}/assets"
          cp README.md LICENSE "${PACKAGE_NAME}/"

      - name: Package (tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${env:PACKAGE_NAME}" -DestinationPath "${env:PACKAGE_NAME}.zip"
          $hash = Get-FileHash "${env:PACKAGE_NAME}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($env:PACKAGE_NAME).zip" |
            Out-File -Encoding ascii "${env:PACKAGE_NAME}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz
            *.sha256
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Collect every platform's package and publish them in one shot
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
