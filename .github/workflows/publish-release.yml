name: "Publish Release"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach assets to (required for manual runs)"
        required: true
        default: "v0.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

env:
  BUILD_DIR: build
  INSTALL_DIR: package
  PROJECT_NAME: Sortly

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Validate the release tag format (must be strict SemVer)
  # ---------------------------------------------------------------------------
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest

    steps:
      - name: Resolve and validate tag
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${RELEASE_TAG}' is not a valid semantic version (vX.Y.Z)"
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

  # ---------------------------------------------------------------------------
  # Job 1: Build, test and package the binaries for each target platform
  # ---------------------------------------------------------------------------
  build:
    name: Build & Package (${{ matrix.os }})
    needs: validate-tag
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz

          - os: windows-latest
            platform: windows-x64
            archive: zip

    runs-on: ${{ matrix.os }}

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S . \
            -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSORTLY_BUILD_SHARED=OFF \
            ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        shell: bash
        run: cmake --build "${BUILD_DIR}" --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir "${BUILD_DIR}" --build-config Release --output-on-failure

      - name: Install
        shell: bash
        run: |
          mkdir -p "${INSTALL_DIR}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "${BUILD_DIR}/bin/Release/${PROJECT_NAME}.exe" "${INSTALL_DIR}/"
          else
            cp "${BUILD_DIR}/bin/${PROJECT_NAME}" "${INSTALL_DIR}/"
          fi
          cp README.md LICENSE "${INSTALL_DIR}/"

      - name: Set package name
        shell: bash
        run: |
          echo "PACKAGE_NAME=${PROJECT_NAME}-${RELEASE_TAG}-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${PACKAGE_NAME}.tar.gz" -C "${INSTALL_DIR}" .

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${env:INSTALL_DIR}\*" `
            -DestinationPath "${env:PACKAGE_NAME}.zip"

      - name: Generate SHA256 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum *.tar.gz > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Generate SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = Get-FileHash "${env:PACKAGE_NAME}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($env:PACKAGE_NAME).zip" |
            Out-File -Encoding ascii "${env:PACKAGE_NAME}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz
            *.sha256
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Collect every platform's package and publish them in one shot
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          overwrite_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
