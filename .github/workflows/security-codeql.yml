name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "libs/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/security-codeql.yml"

  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "libs/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/security-codeql.yml"

  # Monthly, so new CodeQL queries also run on code that has not changed.
  schedule:
    - cron: "0 4 1 * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: cpp
          # Manual build mode: we control exactly what gets compiled and analyzed.
          build-mode: manual
          queries: security-extended
          # Report only Sortly's own sources (third_party is still compiled, never reported).
          config: |
            paths:
              - apps
              - libs

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSORTLY_ENABLE_UNIT_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:cpp"
