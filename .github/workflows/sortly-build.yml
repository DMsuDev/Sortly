name: "Sortly Build"

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "libs/**"
      - "third_party/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "VERSION"
      - ".gitmodules"
      - ".github/workflows/sortly-build.yml"

  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "libs/**"
      - "third_party/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "VERSION"
      - ".gitmodules"
      - ".github/workflows/sortly-build.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DIR: build

jobs:
  build_and_test:
    name: Build (${{ matrix.os }}, ${{ matrix.build_type }})
    timeout-minutes: 45

    strategy:
      # Let every combination finish, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S . \
            -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        shell: bash
        run: cmake --build "${BUILD_DIR}" --config ${{ matrix.build_type }} --parallel

      - name: Test
        shell: bash
        run: |
          ctest \
            --test-dir "${BUILD_DIR}" \
            --build-config ${{ matrix.build_type }} \
            --output-on-failure \
            --parallel "$(nproc 2>/dev/null || echo 2)" \
            --timeout 120
